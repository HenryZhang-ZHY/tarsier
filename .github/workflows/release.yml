# Builds tarsier for Windows and publishes the archive as a GitHub release.
# Pushing a tag `v<version>` (matching Cargo.toml) releases it; running the
# workflow by hand builds the same archive as a workflow artifact only, to try
# it before tagging.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      name: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
              echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml's version $version"
              exit 1
            fi
            name="$GITHUB_REF_NAME"
          else
            name="v$version-${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          $dir = "tarsier-${{ needs.version.outputs.name }}-windows-x86_64"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item target\release\tarsier.exe, README.md, README.zh.md, LICENSE $dir
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x86_64
          path: tarsier-*.zip
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [version, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum tarsier-* > SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "tarsier ${{ needs.version.outputs.version }}" \
            --generate-notes \
            --verify-tag
